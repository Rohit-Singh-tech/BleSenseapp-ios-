name: Build BLESense iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build and Package IPA
        run: |
          chmod +x ./build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLESense-iOS-IPA
          path: ./BLESense.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "BLESense iOS v1.0.0 (Compiled IPA)"
          body: "Direct compiled iOS ARM64 Application Archive ready for Sideloadly / AltStore / TestFlight."
          files: ./BLESense.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
